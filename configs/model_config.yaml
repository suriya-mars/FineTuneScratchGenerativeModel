model:
  name: "unsloth/Qwen2.5-3B-bnb-4bit"
  max_seq_len: 512

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  batch_size: 1                         # 6GB VRAM — must stay at 1
  grad_accum_steps: 16                  # effective batch = 16
  learning_rate: 0.0002
  warmup_ratio: 0.05
  num_epochs: 3
  weight_decay: 0.01
  seed: 42
  output_dir: "outputs/checkpoints"

data:
  train_file: "data/splits/train_cot.jsonl"
  val_file:   "data/splits/val_cot.jsonl"

logging:
  eval_steps: 50
  save_steps: 100
